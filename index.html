<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghelli Study Hub</title>
<meta name="description" content="Notes, flashcards, topic questions and past papers for A Level, IGCSE and GCSE.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151716" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script>try{var t=localStorage.getItem("gsh-theme");if(t){t=t.replace(/"/g,"");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div class="side-scrim" id="sideScrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="top-right">
        <button class="search-trigger" id="searchBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
          <span>Search</span><kbd>⌘K</kbd>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5Z"/></svg>
        </button>
      </div>
    </header>
    <div class="page" id="page"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="palette" role="dialog" aria-label="Search">
    <div class="palette-input">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="q" placeholder="Search topics, subjects or spec codes" autocomplete="off" aria-label="Search">
      <kbd>esc</kbd>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<script src="/assets/data.js"></script>
<script src="/assets/viewer.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
